services:
  postgres:
    image: postgres:16-alpine
    container_name: mailog-postgres
    environment:
      POSTGRES_USER: mailog
      POSTGRES_PASSWORD: mailog
      POSTGRES_DB: mailog
    ports:
      - '5433:5432'
    volumes:
      - mailog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailog']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mailog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailog-admin
      MINIO_ROOT_PASSWORD: mailog-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - mailog_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mailog_pg_data:
  mailog_minio_data:
